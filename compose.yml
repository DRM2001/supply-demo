services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supply
      POSTGRES_USER: supply
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    volumes:
      - supply-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply -d supply"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/supply
      DB_USER: supply
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Define ADMIN_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  supply-data:
